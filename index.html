<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda — Play Thau'Gether</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#EFE2D3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda PTG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --beige:#EFE2D3;
    --papier:#FAF4EC;
    --marron:#5C3A21;
    --terracotta:#C0522A;
    --teal:#2F6E62;
    --trait:rgba(92,58,33,.16);
    --doux:rgba(92,58,33,.58);
    --rayon:14px;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --corps:"Inter",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--beige);
    color:var(--marron);
    font-family:var(--corps);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--terracotta);outline-offset:2px;border-radius:4px}
  .cache{display:none !important}

  /* ---------- Ossature ---------- */
  .enveloppe{max-width:620px;margin:0 auto;padding:0 18px}

  header.bandeau{
    padding:26px 0 18px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  }
  .marque{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.02em;margin:0}
  .marque span{display:block;font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--doux);margin-top:6px}
  .qui{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:.78rem;color:var(--doux);text-align:right}
  .lien-nu{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.78rem;color:var(--doux)}
  .lien-nu:hover{color:var(--terracotta)}

  /* ---------- Boutons ---------- */
  .btn{
    border:0;border-radius:999px;padding:11px 20px;
    font-weight:600;font-size:.9rem;
    background:var(--marron);color:var(--beige);
    transition:transform .12s ease,opacity .12s ease;
  }
  .btn:hover{opacity:.88}
  .btn:active{transform:scale(.97)}
  .btn.plein-terracotta{background:var(--terracotta);color:#fff}
  .btn.contour{background:transparent;color:var(--marron);border:1.5px solid var(--trait)}
  .btn.contour:hover{border-color:var(--marron);opacity:1}
  .btn.large{width:100%;padding:14px}

  /* ---------- Écran de connexion ---------- */
  .portail{max-width:380px;margin:8vh auto 0;padding:0 22px;text-align:left}
  .portail h1{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:-.03em;margin:0 0 6px}
  .portail p.sous{color:var(--doux);margin:0 0 26px;font-size:.92rem}
  label{display:block;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--doux);margin-bottom:6px}
  input,textarea{
    width:100%;font:inherit;color:var(--marron);
    background:var(--papier);border:1.5px solid var(--trait);
    border-radius:10px;padding:12px 13px;margin-bottom:15px;
  }
  input:focus,textarea:focus{border-color:var(--marron);outline:none}
  textarea{resize:vertical;min-height:70px}
  .alerte{
    background:rgba(192,82,42,.1);border-left:3px solid var(--terracotta);
    padding:10px 13px;border-radius:0 8px 8px 0;font-size:.86rem;margin-bottom:15px;
  }

  /* ---------- Onglets ---------- */
  .onglets{display:flex;gap:18px;border-bottom:1.5px solid var(--trait);margin-bottom:22px}
  .onglet{
    background:none;border:0;padding:0 0 11px;margin-bottom:-1.5px;
    font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--doux);border-bottom:2.5px solid transparent;
  }
  .onglet[aria-selected="true"]{color:var(--marron);border-bottom-color:var(--terracotta)}

  /* ---------- À faire / relances ---------- */
  .faire{
    border:1.5px solid var(--trait);border-radius:var(--rayon);
    background:var(--papier);margin-bottom:26px;overflow:hidden;
  }
  .faire-titre{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;background:var(--marron);color:var(--beige);
  }
  .faire-titre h3{
    font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;margin:0;
  }
  .faire-titre .pastoche{
    font-family:var(--mono);font-size:.64rem;font-weight:700;
    background:var(--terracotta);color:#fff;border-radius:999px;padding:2px 8px;
  }
  .faire-ligne{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px 16px;border-top:1.5px solid var(--trait);
  }
  .faire-ligne:first-of-type{border-top:0}
  .faire-quoi{flex:1;min-width:150px;font-size:.87rem;line-height:1.45}
  .faire-quoi b{font-weight:600}
  .faire-quoi em{
    font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--doux);
    display:block;margin-top:2px;
  }
  .btn.wa{background:var(--teal);color:#fff;padding:8px 15px;font-size:.82rem;white-space:nowrap}
  .btn.wa:hover{opacity:.85}

  /* ---------- Soirées en attente ---------- */
  .att-bloc{margin-bottom:34px}
  .att-titre{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:4px 0 13px;padding-bottom:9px;
    border-bottom:2.5px dashed var(--terracotta);
  }
  .att-titre h3{
    font-family:var(--display);font-weight:800;font-size:1.05rem;
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--terracotta);
  }
  .att-titre .compte{font-family:var(--mono);font-size:.68rem;color:var(--doux);font-weight:500}
  .carte.en-attente{
    border-style:dashed;border-color:rgba(192,82,42,.55);
    background:linear-gradient(0deg,rgba(192,82,42,.035),rgba(192,82,42,.035)),var(--papier);
  }
  .att-badge{
    display:inline-block;font-family:var(--mono);font-size:.58rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;margin-bottom:6px;
    border:1.5px solid var(--terracotta);color:var(--terracotta);
  }
  .att-badge.pret{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
  .att-barre{
    display:flex;align-items:center;gap:11px;flex-wrap:wrap;
    padding:12px 17px;border-top:1.5px dashed rgba(192,82,42,.4);
    background:rgba(192,82,42,.05);
  }
  .att-jauge{
    font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--doux);flex:1;min-width:120px;
  }
  .att-jauge b{color:var(--terracotta)}
  .att-jauge.pret b{color:var(--teal)}
  .btn.mini{padding:8px 15px;font-size:.82rem}
  .att-note{
    font-size:.84rem;color:var(--doux);line-height:1.5;
    margin:0 0 16px;padding:11px 14px;
    border-left:3px solid var(--terracotta);background:rgba(192,82,42,.06);
    border-radius:0 8px 8px 0;
  }
  .recap-att{
    font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--terracotta);
    border:1px solid var(--terracotta);border-radius:999px;padding:1px 6px;margin-left:6px;
    white-space:nowrap;
  }
  .jour.soireeatt::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,var(--terracotta) 0 4px,transparent 4px 8px);
  }
  .jour.soireeatt .num{padding-top:3px}

  /* ---------- En-tête de mois ---------- */
  .mois{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:4px 0 13px;padding-bottom:9px;border-bottom:2.5px solid var(--terracotta);
  }
  .mois + .carte{margin-top:0}
  .groupe + .groupe{margin-top:32px}
  .mois h3{
    font-family:var(--display);font-weight:800;font-size:1.05rem;
    letter-spacing:.03em;text-transform:uppercase;margin:0;
  }
  .mois .compte{font-family:var(--mono);font-size:.68rem;color:var(--doux);font-weight:500}
  .mois button{white-space:nowrap;text-align:right}

  /* ---------- Carte soirée ---------- */
  .carte{
    background:var(--papier);border:1.5px solid var(--trait);border-radius:var(--rayon);
    margin-bottom:16px;overflow:hidden;
  }
  .carte.passee{opacity:.62}
  .haut{display:flex;gap:15px;padding:17px 17px 14px}
  .pastille{
    flex:0 0 58px;text-align:center;background:var(--marron);color:var(--beige);
    border-radius:10px;padding:9px 0 8px;font-family:var(--mono);
  }
  .pastille .j{display:block;font-size:1.45rem;font-weight:700;line-height:1}
  .pastille .m{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;opacity:.82}
  .infos{min-width:0;flex:1}
  .infos h2{font-family:var(--display);font-weight:700;font-size:1.18rem;letter-spacing:-.015em;margin:0 0 5px;overflow-wrap:anywhere}
  .meta{font-family:var(--mono);font-size:.76rem;color:var(--doux);line-height:1.7}
  .meta b{color:var(--marron);font-weight:700}
  .note{font-size:.88rem;color:var(--doux);margin:9px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}

  /* ---------- Signature : l'appel des 5 ---------- */
  .appel{
    display:flex;flex-wrap:wrap;gap:7px;
    padding:13px 17px;border-top:1.5px dashed var(--trait);
  }
  .jeton{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:.72rem;font-weight:700;
    padding:5px 11px;border-radius:999px;border:1.5px solid var(--trait);
    color:var(--doux);background:transparent;
  }
  .jeton::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--trait);flex:0 0 auto}
  .jeton.oui{background:var(--teal);border-color:var(--teal);color:#fff}
  .jeton.oui::before{background:#fff}
  .jeton.tard{border-color:var(--terracotta);color:var(--terracotta)}
  .jeton.tard::before{background:var(--terracotta)}
  .jeton.peutetre{border-style:dashed;border-color:var(--marron);color:var(--marron);opacity:.75}
  .jeton.peutetre::before{background:var(--marron)}
  .jeton.non{color:var(--doux);text-decoration:line-through;text-decoration-thickness:1.5px}
  .jeton.moi{box-shadow:0 0 0 3px rgba(92,58,33,.1)}

  /* ---------- Barre de réponse ---------- */
  .repondre{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 17px 15px}
  .rep{
    flex:1;border:1.5px solid var(--trait);background:transparent;border-radius:10px;
    padding:10px 4px;font-size:.84rem;font-weight:600;color:var(--doux);
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .rep:hover{border-color:var(--marron);color:var(--marron)}
  .rep[aria-pressed="true"]{background:var(--marron);border-color:var(--marron);color:var(--beige)}
  .rep.oui[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  .rep.tard[aria-pressed="true"]{background:var(--terracotta);border-color:var(--terracotta);color:#fff}
  .rep.peutetre[aria-pressed="true"]{
    background:transparent;border-color:var(--marron);border-style:dashed;
    border-width:2px;color:var(--marron);
  }
  .rep.non[aria-pressed="true"]{background:var(--marron);border-color:var(--marron);color:var(--beige)}

  .pied-carte{
    display:flex;gap:16px;align-items:center;
    padding:11px 17px;border-top:1.5px solid var(--trait);background:rgba(92,58,33,.03);
  }

  /* ---------- Récap ---------- */
  .recap{width:100%;border-collapse:collapse;font-family:var(--mono);table-layout:fixed}
  .recap thead th{
    font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--doux);padding:0 0 8px;text-align:center;
    border-bottom:2.5px solid var(--terracotta);
  }
  .recap thead th.quoi{text-align:left}
  .recap col.cmembre{width:36px}
  .recap col.ctotal{width:42px}
  .recap tbody td{padding:9px 0;text-align:center;border-bottom:1px solid var(--trait)}
  .recap tbody tr:last-child td{border-bottom:0}
  .recap td.quoi{text-align:left;padding-right:12px}
  .recap td.quoi b{
    display:block;font-family:var(--corps);font-weight:600;font-size:.88rem;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .recap td.quoi span{font-size:.66rem;color:var(--doux)}
  .recap tr.moisligne td{
    padding:22px 0 6px;font-size:.6rem;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--doux);text-align:left;border-bottom:0;
  }
  .recap tbody tr.moisligne:first-child td{padding-top:6px}
  .sig{font-size:.98rem;font-weight:700;line-height:1}
  .sig.oui{color:var(--teal)}
  .sig.tard{color:var(--terracotta)}
  .sig.peutetre{color:var(--marron);opacity:.6;font-weight:700}
  .sig.non{color:var(--doux);font-weight:500}
  .sig.sans{color:rgba(92,58,33,.26);font-weight:500}
  .tot{font-size:.74rem;font-weight:700;color:var(--marron)}
  .tot.creux{color:rgba(92,58,33,.3);font-weight:500}
  .legende{
    display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:18px;padding-top:14px;
    border-top:1px solid var(--trait);
    font-family:var(--mono);font-size:.64rem;color:var(--doux);
  }
  .legende b{font-weight:700;font-size:.8rem}
  @media (max-width:430px){
    .recap col.cmembre{width:30px}
    .recap col.ctotal{width:36px}
    .recap thead th{font-size:.54rem;letter-spacing:.05em}
    .recap td.quoi b{font-size:.83rem}
    .recap td.quoi span{font-size:.61rem}
  }

  /* ---------- Dispos ---------- */
  .navmois{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:14px;padding-bottom:10px;border-bottom:2.5px solid var(--terracotta);
  }
  .navmois h3{
    font-family:var(--display);font-weight:800;font-size:1.05rem;
    letter-spacing:.03em;text-transform:uppercase;margin:0;text-align:center;flex:1;
  }
  .fleche{
    background:none;border:1.5px solid var(--trait);border-radius:9px;
    width:36px;height:32px;font-size:1rem;line-height:1;color:var(--doux);flex:0 0 auto;
  }
  .fleche:hover{border-color:var(--marron);color:var(--marron)}
  .grille{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .entetejour{
    text-align:center;font-family:var(--mono);font-size:.58rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--doux);padding-bottom:3px;
  }
  .jour{
    position:relative;aspect-ratio:1/1.06;border-radius:10px;
    border:1.5px solid var(--trait);background:var(--papier);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:0;overflow:hidden;
  }
  .jour.creux{border:0;background:transparent;pointer-events:none}
  .jour .num{font-family:var(--mono);font-size:.82rem;font-weight:700;line-height:1}
  .jour.avant{opacity:.4}
  .jour.mienoui{border-color:var(--teal);border-width:2.5px;background:rgba(47,110,98,.09)}
  .jour.soiree::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--terracotta);
  }
  .jour.soiree .num{padding-top:3px}
  .points{display:flex;gap:2.5px;height:6px;align-items:center}
  .points i{width:5px;height:5px;border-radius:50%;background:rgba(92,58,33,.16)}
  .points i.ok{background:var(--teal)}
  .points i.tard{background:var(--terracotta)}
  .dl-bloc{margin-top:26px}
  .dl-titre{
    font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;color:var(--doux);margin:0 0 10px;
    padding-bottom:8px;border-bottom:2.5px solid var(--terracotta);
  }
  .dl-ligne{
    display:flex;align-items:baseline;gap:11px;
    padding:10px 0;border-bottom:1px solid var(--trait);
  }
  .dl-ligne:last-child{border-bottom:0}
  .dl-quand{
    font-family:var(--mono);font-size:.76rem;font-weight:700;
    flex:0 0 74px;text-transform:capitalize;
  }
  .dl-noms{flex:1;font-size:.85rem;line-height:1.4;min-width:0}
  .dl-nb{
    font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--teal);flex:0 0 auto;
  }
  .dl-ligne.pris .dl-quand{color:var(--terracotta)}
  .dl-ligne.pris .dl-noms::after{
    content:" — soirée déjà posée";font-family:var(--mono);font-size:.64rem;color:var(--terracotta);
  }
  .conseilmois{
    margin-top:16px;padding:13px 15px;border:1.5px solid var(--trait);border-radius:12px;
    background:var(--papier);font-size:.85rem;line-height:1.55;
  }
  .conseilmois b{font-family:var(--mono);font-size:.8rem}
  .aide{
    margin-top:14px;font-family:var(--mono);font-size:.64rem;color:var(--doux);
    display:flex;flex-wrap:wrap;gap:6px 16px;
  }
  .aide span{display:inline-flex;align-items:center;gap:6px}
  .aide i{width:9px;height:9px;border-radius:50%;background:rgba(92,58,33,.16);display:inline-block}
  .aide i.ok{background:var(--teal)}
  .aide i.bar{background:var(--terracotta);border-radius:2px;width:14px;height:4px}
  .aide i.bar.tirets{
    background:repeating-linear-gradient(90deg,var(--terracotta) 0 4px,transparent 4px 8px);
    border-radius:0;
  }

  /* ---------- Vide ---------- */
  .vide{
    text-align:center;padding:52px 24px;border:1.5px dashed var(--trait);
    border-radius:var(--rayon);color:var(--doux);
  }
  .vide strong{display:block;font-family:var(--display);font-size:1.15rem;color:var(--marron);margin-bottom:6px}

  /* ---------- Voile & panneaux ---------- */
  .voile{
    position:fixed;inset:0;background:rgba(45,28,16,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:16px;
  }
  .panneau{
    background:var(--papier);border-radius:18px;padding:22px;
    width:100%;max-width:520px;max-height:88vh;overflow:auto;
    animation:monte .22s ease;
  }
  @keyframes monte{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .panneau{animation:none}
    *{transition:none !important}
  }
  @media (min-width:560px){.voile{align-items:center}}
  .panneau h3{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin:0 0 4px}
  .panneau p.sous{color:var(--doux);font-size:.88rem;margin:0 0 20px}
  .duo{display:flex;gap:11px}
  .duo>*{flex:1}

  .flottant{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:20;box-shadow:0 6px 22px rgba(45,28,16,.26);
  }
  .installe{
    background:var(--papier);border:1.5px solid var(--trait);border-radius:12px;
    padding:13px 15px;font-size:.83rem;color:var(--doux);margin-bottom:18px;
    display:flex;gap:12px;align-items:flex-start;
  }
</style>
</head>

const MOIS  = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const MOIS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août",
                   "septembre","octobre","novembre","décembre"];

const heure = ms => new Date(ms).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const jourLong = ms => { const d = new Date(ms); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const tampon = ms => new Date(ms).toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
const pourInput = ms => {
  const d = new Date(ms - d0(ms));
  return d.toISOString().slice(0,16);
};
function d0(ms){ return new Date(ms).getTimezoneOffset() * 60000; }
const echappe = t => String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");

/* ---------------- Export agenda ---------------- */
function lienGoogle(s){
  const p = new URLSearchParams({
    action:"TEMPLATE",
    text: s.titre,
    dates: `${tampon(s.debut)}/${tampon(s.fin)}`,
    location: s.lieu || "",
    details: (s.description || "") + "\n\nPlay Thau'Gether"
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function blocVevent(s){
  return [
    "BEGIN:VEVENT",
    `UID:${s.id}@playthaugether`,
    `DTSTAMP:${tampon(Date.now())}`,
    `DTSTART:${tampon(s.debut)}`,
    `DTEND:${tampon(s.fin)}`,
    `SUMMARY:${echappe(s.titre)}`,
    `LOCATION:${echappe(s.lieu)}`,
    `DESCRIPTION:${echappe((s.description||"") + "\n\nPlay Thau'Gether")}`,
    "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",
    `DESCRIPTION:${echappe(s.titre)} — dans 1 heure`,
    "END:VALARM","END:VEVENT"
  ];
}

const nomFichier = t => t.replace(/[^\w\sÀ-ÿ-]/g,"").trim().replace(/\s+/g,"-") + ".ics";

// Accepte une soirée ou une liste : un seul fichier .ics contient autant
// d'événements qu'on veut, donc un seul import pour tout un mois.
function telechargeIcs(quoi, nom){
  const liste = Array.isArray(quoi) ? quoi : [quoi];
  if (!liste.length) return;
  const lignes = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Play Thau\'Gether//Agenda//FR","CALSCALE:GREGORIAN",
    ...liste.flatMap(blocVevent),
    "END:VCALENDAR"
  ];
  const blob = new Blob([lignes.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomFichier(nom || liste[0].titre);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// Une soirée sans champ statut est considérée validée : les soirées
// créées avant cette fonctionnalité restent affichées normalement.
const enAttente = s => s.statut === "attente";
// Le seuil sert à savoir si la soirée peut être TENUE : seuls les
// "je viens" comptent. Un retardataire ou un "peut-être" ne permet
// pas d'encadrer la soirée.
const confirmes = s => Object.values(s.presences || {})
                             .filter(v => v === "oui").length;

/* ---------------- Messages WhatsApp ---------------- */

// Qui n'a pas encore répondu sur cette soirée
function sansReponse(s){
  const p = s.presences || {};
  return Object.entries(MEMBRES)
    .filter(([email]) => { const uid = uidParEmail[email]; return !uid || !p[uid]; })
    .map(([, nom]) => nom);
}
// Les noms par statut, pour rédiger des messages qui ne mélangent pas
// ceux qui tiennent la soirée et ceux qui passent en cours de route.
function nomsParStatut(s, statut){
  const p = s.presences || {};
  return Object.entries(MEMBRES)
    .filter(([email]) => { const uid = uidParEmail[email]; return uid && p[uid] === statut; })
    .map(([, nom]) => nom);
}

const quand = s => `${jourLong(s.debut)} à ${heure(s.debut)}`;
const liste = n => n.length < 2 ? (n[0] || "") : n.slice(0,-1).join(", ") + " et " + n[n.length-1];

function texteMessage(type, s){
  // Tiret plutôt qu'une préposition : "au La Hune" serait fautif, et le champ
  // lieu peut contenir n'importe quelle forme (L'Audace, Cinéma Quai des Lumières...).
  const lieu = s.lieu ? ` — ${s.lieu}` : "";
  if (type === "nouvelle")
    return `Nouvelle soirée posée : ${s.titre}, ${quand(s)}${lieu}.\n\n`
         + `Dites si vous êtes là : ${LIEN_APP}`;
  if (type === "relance-lot"){
    // Lieu et titre communs sortis en en-tête : une proposition de salle
    // arrive en bloc, inutile de répéter huit fois la même ligne.
    const memeLieu  = s.every(x => x.lieu  === s[0].lieu)  && s[0].lieu;
    const memeTitre = s.every(x => x.titre === s[0].titre);
    const entete = memeTitre && memeLieu
      ? `Il reste des dates à valider pour ${s[0].titre} — ${s[0].lieu} :`
      : memeLieu
      ? `Il reste des réponses à donner — ${s[0].lieu} :`
      : `Il reste des réponses à donner sur l'agenda :`;

    const lignes = s.map(x => {
      const manquants = sansReponse(x);
      const qui = manquants.length === Object.keys(MEMBRES).length
        ? "personne n'a répondu"
        : `il manque ${liste(manquants)}`;
      const quoi = memeTitre ? "" : `${x.titre}, `;
      const ou   = memeLieu  ? "" : (x.lieu ? ` — ${x.lieu}` : "");
      return `- ${quoi}${quand(x)}${ou} : ${qui}`;
    });
    return `${entete}\n\n${lignes.join("\n")}\n\n`
         + `Un clic par soirée suffit : ${LIEN_APP}`;
  }
  if (type === "relance"){
    const manquants = sansReponse(s);
    return `Il manque encore ${liste(manquants)} sur ${s.titre}, ${quand(s)}${lieu}.\n\n`
         + `Un clic suffit : ${LIEN_APP}`;
  }
  if (type === "veille"){
    const surs  = nomsParStatut(s, "oui");
    const tard  = nomsParStatut(s, "tard");
    const peut  = nomsParStatut(s, "peutetre");
    const bouts = [];
    if (surs.length) bouts.push(`Présents : ${liste(surs)}.`);
    if (tard.length) bouts.push(`Plus tard : ${liste(tard)}.`);
    if (peut.length) bouts.push(`Peut-être : ${liste(peut)}.`);
    return `Rappel : ${s.titre} c'est demain à ${heure(s.debut)}${lieu}.\n\n`
         + (bouts.length ? bouts.join("\n") : `Personne n'a confirmé pour l'instant.`);
  }
  if (type === "validee")
    return `${s.titre} est validée : ${quand(s)}${lieu}.\n\n`
         + `Ajoutez-la à votre agenda depuis l'app : ${LIEN_APP}`;
  return "";
}

// wa.me ouvre WhatsApp avec le texte prêt ; le choix du groupe reste manuel,
// WhatsApp ne permet pas de cibler une conversation depuis un lien.
function versWhatsApp(type, s){
  const texte = texteMessage(type, s);
  const url = "https://wa.me/?text=" + encodeURIComponent(texte);
  const f = window.open(url, "_blank", "noopener");
  if (!f) panneauTexte(texte);           // pop-up bloquée : on montre le texte à copier
}

function panneauPrevenir(type, s){
  ouvre(`
    <h3>${type === "nouvelle" ? "Soirée posée" : "Soirée validée"}</h3>

    </div>`);
  $("#prevenir").onclick = () => { const t = type; ferme(); versWhatsApp(t, s); };
  $("#pas-maintenant").onclick = ferme;

function panneauTexte(texte){
  ouvre(`
    <h3>Message prêt</h3>
    <p class="sous">WhatsApp ne s'est pas ouvert. Copie le message et colle-le dans le groupe.</p>
    <textarea id="txt-msg" style="min-height:150px">${txt(texte)}</textarea>
    <div class="duo">
      <button class="btn contour" id="fermer-txt">Fermer</button>
      <button class="btn plein-terracotta" id="copier">Copier</button>
    </div>`);
  $("#fermer-txt").onclick = ferme;
  $("#copier").onclick = async () => {
    try { await navigator.clipboard.writeText(texte); $("#copier").textContent = "Copié"; }
    catch { $("#txt-msg").select(); }
  };
}

// Ce qui mérite un message aujourd'hui, par ordre d'urgence.
function construitAFaire(lotBrut){
  const now = Date.now();
  const lot = [...lotBrut].sort((a, b) => a.debut - b.debut);
  const lignes = [];

  // 1. Demain : rappel aux présents
  lot.filter(s => !enAttente(s) && s.debut > now && s.debut < now + 36*3600000)
     .forEach(s => lignes.push({
       quoi: `<b>${txt(s.titre)}</b> c'est demain<em>${nomsParStatut(s,"oui").length} confirmé${nomsParStatut(s,"oui").length > 1 ? "s" : ""} · ${heure(s.debut)}</em>`,
       type: "veille", id: s.id, libelle: "Rappel" }));

  // 2. Soirées en attente qui ont atteint le seuil
  lot.filter(s => enAttente(s) && confirmes(s) >= SEUIL_VALIDATION)
     .forEach(s => lignes.push({
       quoi: `<b>${txt(s.titre)}</b> peut être validée<em>${confirmes(s)} confirmés · ${quand(s)}</em>`,
       type: null, id: s.id, libelle: "Valider", valider: true }));

  // 3. Réponses manquantes : TOUTES les soirées à venir, sans limite de
  //    date — une proposition de lieu peut arriver des mois à l'avance.
  const aRelancer = lot.filter(s => s.debut > now && sansReponse(s).length);

  if (aRelancer.length === 1){
    const s = aRelancer[0];
    lignes.push({
      quoi: `<b>${txt(s.titre)}</b> attend ${liste(sansReponse(s))}<em>${quand(s)}</em>`,
      type: "relance", id: s.id, libelle: "Relancer" });
  } else if (aRelancer.length > 1){
    // Un seul message pour tout le lot : huit messages d'affilée dans le
    // groupe, personne ne les lit.
    lignes.push({
      quoi: `<b>${aRelancer.length} soirées</b> attendent des réponses`
          + `<em>de ${jourLong(aRelancer[0].debut)} à ${jourLong(aRelancer[aRelancer.length-1].debut)}</em>`,
      type: "relance-lot", id: "lot", libelle: "Relancer" });
  }

  if (!lignes.length) return "";

  return `<div class="faire">
    <div class="faire-titre"><h3>À faire</h3><span class="pastoche">${lignes.length}</span></div>
    ${lignes.map(l => `<div class="faire-ligne">
      <span class="faire-quoi">${l.quoi}</span>
      ${l.valider
        ? `<button class="btn mini plein-terracotta" data-val="${l.id}">${l.libelle}</button>`
        : `<button class="btn mini wa" data-wa="${l.id}" data-type="${l.type}">${l.libelle}</button>`}
    </div>`).join("")}
  </div>`;
}

const SIGNE = { oui:"✓", tard:"+", peutetre:"?", non:"×", sans:"·" };
const JOURS_COURTS = ["lun","mar","mer","jeu","ven","sam","dim"];
const cleJour = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

async function basculeDispo(cle){
  const actuel  = (dispos[monEmail] || {})[cle] || "";
  const suivant = actuel === "oui" ? "" : "oui";   // coché = dispo, rien = pas dispo
  try {
    await setDoc(doc(db,"dispos",moi.uid),
      { email: monEmail, jours: { [cle]: suivant } }, { merge:true });
  } catch { alert("Disponibilité non enregistrée. Vérifie ta connexion."); }
}

function dessineDispos(){
  const aujourdhui = new Date();
  if (!moisVu) moisVu = { a: aujourdhui.getFullYear(), m: aujourdhui.getMonth() };
  const { a, m } = moisVu;

  const premier  = new Date(a, m, 1);
  const nbJours  = new Date(a, m + 1, 0).getDate();
  const decalage = (premier.getDay() + 6) % 7;          // semaine qui commence le lundi
  const debutJour = new Date(); debutJour.setHours(0,0,0,0);

  // soirées déjà posées ce mois-ci
  const soireeParJour = {};
  soirees.forEach(s => {
    const d = new Date(s.debut);
    if (d.getFullYear() === a && d.getMonth() === m) (soireeParJour[cleJour(d)] ||= []).push(s);
  });
  // Un jour compte comme "pris" seulement si une soirée validée y est posée ;
  // une soirée encore en attente est signalée différemment.
  const estPris    = cle => (soireeParJour[cle] || []).some(s => !enAttente(s));
  const estPropose = cle => (soireeParJour[cle] || []).some(enAttente);

  const emails = Object.keys(MEMBRES);
  const cellules = [];
  for (let i = 0; i < decalage; i++) cellules.push('<div class="jour creux"></div>');

  const scores = [];
  for (let n = 1; n <= nbJours; n++){
    const d   = new Date(a, m, n);
    const cle = cleJour(d);
    const mien = (dispos[monEmail] || {})[cle] || "";
    const aSoiree  = estPris(cle);
    const aPropose = estPropose(cle);

    const libresNoms = [];
    const points = emails.map(email => {
      const st = (dispos[email] || {})[cle] || "";
      if (st === "oui") libresNoms.push(MEMBRES[email]);
      return `<i class="${st === "oui" ? "ok" : ""}"></i>`;
    }).join("");
    const libres = libresNoms.length;

    if (libres >= 2) scores.push({ n, d, libres, noms: libresNoms, aSoiree });

    const classes = ["jour"];
    if (mien === "oui") classes.push("mienoui");
    if (aSoiree) classes.push("soiree");
    else if (aPropose) classes.push("soireeatt");
    if (d < debutJour) classes.push("avant");

    cellules.push(`<button class="${classes.join(" ")}" data-jour="${cle}"
      aria-pressed="${mien === "oui"}"
      aria-label="${n} ${MOIS_LONG[m]}, ${libres} disponible${libres > 1 ? "s" : ""}${aSoiree ? ", soirée posée" : ""}">
      <span class="num">${n}</span><span class="points">${points}</span></button>`);
  }

  const conseil = scores.length
    ? `<div class="dl-bloc">
        <p class="dl-titre">Jours avec au moins 2 personnes</p>
        ${scores.map(x => `<div class="dl-ligne ${x.aSoiree ? "pris" : ""}">
          <span class="dl-quand">${JOURS_COURTS[(x.d.getDay()+6)%7]} ${String(x.n).padStart(2,"0")}/${String(m+1).padStart(2,"0")}</span>
          <span class="dl-noms">${x.noms.join(" · ")}</span>
          <span class="dl-nb">${x.libres}/${emails.length}</span>
        </div>`).join("")}
      </div>`
    : `<div class="conseilmois">Aucun jour ne réunit deux personnes pour l'instant.
        Tape sur les jours où tu es libre — un jour non coché compte comme
        <b>pas disponible</b>.</div>`;

  $("#liste").innerHTML = `
    <div class="navmois">
      <button class="fleche" id="mois-moins" aria-label="Mois précédent">‹</button>
      <h3>${MOIS_LONG[m]} ${a}</h3>
      <button class="fleche" id="mois-plus" aria-label="Mois suivant">›</button>
    </div>
    <div class="grille">
      ${JOURS_COURTS.map(j => `<div class="entetejour">${j}</div>`).join("")}
      ${cellules.join("")}
    </div>
    ${conseil}
    <div class="aide">
      <span><i class="ok"></i> un point par membre disponible</span>
      <span><i class="bar"></i> soirée déjà posée</span>
      <span><i class="bar tirets"></i> soirée en attente de validation</span>
      <span>tape un jour pour te déclarer libre, retape pour annuler</span>
    </div>`;

  $("#mois-moins").onclick = () => { moisVu = m === 0  ? { a:a-1, m:11 } : { a, m:m-1 }; dessine(); };
  $("#mois-plus").onclick  = () => { moisVu = m === 11 ? { a:a+1, m:0  } : { a, m:m+1 }; dessine(); };
  document.querySelectorAll("[data-jour]").forEach(b => {
    b.onclick = () => basculeDispo(b.dataset.jour);
  });
}

function dessineRecap(){
  const lot = soirees.filter(s => s.fin >= Date.now());
  if (!lot.length){
    $("#liste").innerHTML = `<div class="vide"><strong>Rien à récapituler</strong>
      Le tableau se remplira dès qu'une soirée sera posée.</div>`;
    return;
  }

  const noms = Object.entries(MEMBRES);   // [email, prénom]
  let dernierMois = null;

  const lignes = lot.map(s => {
    const d = new Date(s.debut);
    const p = s.presences || {};

    let entete = "";
    const cleMois = `${d.getFullYear()}-${d.getMonth()}`;
    if (cleMois !== dernierMois){
      dernierMois = cleMois;
      entete = `<tr class="moisligne"><td colspan="${noms.length + 2}">${MOIS_LONG[d.getMonth()]} ${d.getFullYear()}</td></tr>`;
    }

    // Une seule définition du compte dans toute l'app : les "je viens".
    let surs = 0;
    const cases = noms.map(([email]) => {
      const uid = uidParEmail[email];
      const st  = (uid && p[uid]) || "sans";
      if (st === "oui") surs++;
      return `<td><span class="sig ${st}">${SIGNE[st]}</span></td>`;
    }).join("");

    const jj = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");

    return entete + `<tr>
      <td class="quoi">
        <b>${txt(s.titre)}${enAttente(s) ? `<span class="recap-att">à valider</span>` : ""}</b>
        <span>${jj} · ${heure(s.debut)}${s.lieu ? " · " + txt(s.lieu) : ""}</span>
      </td>
      ${cases}
      <td class="tot ${surs === 0 ? "creux" : ""}">${surs}/${noms.length}</td>
    </tr>`;
  }).join("");

  $("#liste").innerHTML = `
    <table class="recap">
      <colgroup>
        <col>${noms.map(() => '<col class="cmembre">').join("")}<col class="ctotal">
      </colgroup>
      <thead><tr>
        <th class="quoi">Soirée</th>
        ${noms.map(([, nom]) => `<th title="${txt(nom)}">${txt(nom).slice(0,3)}</th>`).join("")}
        <th title="Nombre de « je viens »">Sûrs</th>
      </tr></thead>
      <tbody>${lignes}</tbody>
    </table>
    <div class="legende">
      <span><b class="sig oui">✓</b> là</span>
      <span><b class="sig tard">+</b> arrive plus tard</span>
      <span><b class="sig peutetre">?</b> peut-être</span>
      <span><b class="sig non">×</b> pas là</span>
      <span><b class="sig sans">·</b> pas répondu</span>
    </div>`;
}

function carte(s, admin){
  const d = new Date(s.debut);
  const p = s.presences || {};
  const mien = p[moi.uid] || null;
  const passee = s.fin < Date.now();
  const vient  = mien === "oui" || mien === "tard";
  const att    = enAttente(s);
  const nb     = confirmes(s);
  const pret   = nb >= SEUIL_VALIDATION;

  const appel = Object.entries(MEMBRES).map(([email, nom]) => {
    const uid = uidParEmail[email];
    const st  = (uid && p[uid]) || "";
    return `<span class="jeton ${st} ${email === monEmail ? "moi" : ""}">${nom}</span>`;
  }).join("");

  const LIBELLE = { oui:"Je viens", tard:"Là plus tard", peutetre:"Peut-être", non:"Pas là" };
  const boutons = ["oui","tard","peutetre","non"].map(st => `
    <button class="rep ${st}" data-rep="${s.id}" data-statut="${st}"
      aria-pressed="${mien === st}">${LIBELLE[st]}</button>`).join("");

  return `<article class="carte ${passee ? "passee" : ""} ${att ? "en-attente" : ""}">
    <div class="haut">
      <div class="pastille"><span class="j">${d.getDate()}</span><span class="m">${MOIS[d.getMonth()]}</span></div>
      <div class="infos">
        ${att ? `<span class="att-badge ${pret ? "pret" : ""}">${pret ? "Prête à valider" : "En attente"}</span>` : ""}
        <h2>${txt(s.titre)}</h2>
        <div class="meta">
          ${jourLong(s.debut)} · <b>${heure(s.debut)} → ${heure(s.fin)}</b>
          ${s.lieu ? `<br>${txt(s.lieu)}` : ""}
        </div>
        ${s.description ? `<p class="note">${txt(s.description)}</p>` : ""}
      </div>
    </div>
    <div class="appel">${appel}</div>
    ${passee ? "" : `<div class="repondre">${boutons}</div>`}
    ${att && !passee ? `<div class="att-barre">
      <span class="att-jauge ${pret ? "pret" : ""}"><b>${nb}</b> / ${SEUIL_VALIDATION} ${pret ? "— le compte y est" : "confirmé" + (nb > 1 ? "s" : "")}</span>
      ${admin ? `<button class="btn mini ${pret ? "plein-terracotta" : "contour"}" data-val="${s.id}">Valider la soirée</button>` : ""}
    </div>` : ""}
    ${(vient && !passee && !att) || admin ? `<div class="pied-carte">
      ${vient && !passee && !att ? `<button class="lien-nu" data-cal="${s.id}">Ajouter à mon agenda</button>` : ""}
      ${admin ? `<button class="lien-nu" data-mod="${s.id}">Modifier</button>
                 <button class="lien-nu" data-sup="${s.id}">Supprimer</button>` : ""}
    </div>` : ""}
  </article>`;
}

const txt = t => String(t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- Actions ---------------- */
async function repondre(s, statut){
  const avant = (s.presences || {})[moi.uid];
  const suivant = avant === statut ? null : statut;
  try {
    await updateDoc(doc(db,"events",s.id), { ["presences." + moi.uid]: suivant });
    // Inutile de proposer l'agenda pour une soirée qui peut encore tomber à l'eau.
    if (!enAttente(s) && (suivant === "oui" || suivant === "tard")) panneauAgenda(s);
  } catch { alert("Réponse non enregistrée. Vérifie ta connexion."); }
}

async function validerSoiree(s){
  const nb = confirmes(s);
  const message = nb >= SEUIL_VALIDATION
    ? `Valider « ${s.titre} » ? Elle rejoindra le programme et chacun pourra l'ajouter à son agenda.`
    : `Seulement ${nb} confirmé${nb > 1 ? "s" : ""} sur les ${SEUIL_VALIDATION} attendus. Valider quand même « ${s.titre} » ?`;
  if (!confirm(message)) return;
  try {
    await updateDoc(doc(db,"events",s.id), { statut: "ok" });
    panneauPrevenir("validee", { ...s, statut: "ok" });
  } catch { alert("Validation impossible. Vérifie ta connexion."); }
}

async function supprimer(s){
  if (!confirm(`Supprimer « ${s.titre} » ? Les réponses seront perdues.`)) return;
  try { await deleteDoc(doc(db,"events",s.id)); }
  catch { alert("Suppression impossible."); }
}

function ferme(){ const v = $("#voile"); if (v) v.remove(); }

function ouvre(html){
  ferme();
  const v = document.createElement("div");
  v.className = "voile"; v.id = "voile";
  v.innerHTML = `<div class="panneau">${html}</div>`;
  v.onclick = e => { if (e.target === v) ferme(); };
  document.body.appendChild(v);
  document.onkeydown = e => { if (e.key === "Escape") ferme(); };
}

function panneauAgenda(s){
  const tard = ((s.presences || {})[moi.uid]) === "tard";
  ouvre(`
    <h3>${tard ? "Noté, tu arrives plus tard" : "C'est noté, tu viens"}</h3>
    <p class="sous">Ajoute la soirée à ton agenda pour recevoir un rappel une heure avant.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a class="btn large" style="text-align:center;text-decoration:none;display:block"
         href="${lienGoogle(s)}" target="_blank" rel="noopener">Ouvrir dans Google Agenda</a>
      <button class="btn large contour" id="ics">Télécharger pour iPhone (.ics)</button>
      <button class="lien-nu" id="plus-tard" style="margin-top:6px">Plus tard</button>
    </div>`);
  $("#ics").onclick = () => { telechargeIcs([s], s.titre); ferme(); };
  $("#plus-tard").onclick = ferme;
}

function panneauMois(g){
  ouvre(`
    <h3>${g.titre}</h3>
    <p class="sous">${g.items.length} soirée${g.items.length > 1 ? "s" : ""} dans un seul fichier,
    avec un rappel une heure avant chacune. Google Agenda n'accepte pas l'ajout groupé,
    alors ce bouton passe par un fichier — il s'importe aussi bien sur iPhone que sur Android.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn large plein-terracotta" id="tout">Télécharger le mois (.ics)</button>
      <button class="lien-nu" id="plus-tard" style="margin-top:6px">Annuler</button>
    </div>`);
  $("#tout").onclick = () => {
    telechargeIcs(g.items, `PTG-${g.titre.replace(" ","-")}`);
    ferme();
  };
  $("#plus-tard").onclick = ferme;
}

function panneauSoiree(s){
  const edition = !!s;
  const debutDefaut = s ? pourInput(s.debut) : "";
  const finDefaut   = s ? pourInput(s.fin)   : "";
  let attDefaut = s ? enAttente(s) : false;
  ouvre(`
    <h3>${edition ? "Modifier la soirée" : "Poser une soirée"}</h3>
    <p class="sous">Les cinq membres la verront tout de suite. Une soirée
    <b>en attente</b> apparaît en haut de la liste jusqu'à ce que tu la valides.</p>
    <div id="err"></div>
    <label for="f-titre">Nom de la soirée</label>
    <input id="f-titre" value="${txt(s?.titre)}" placeholder="Loup-Garou">
    <label for="f-lieu">Lieu</label>
    <input id="f-lieu" value="${txt(s?.lieu)}" placeholder="Bar L'Audace, Sète">
    <div class="duo">
      <div><label for="f-debut">Début</label><input id="f-debut" type="datetime-local" value="${debutDefaut}"></div>
      <div><label for="f-fin">Fin</label><input id="f-fin" type="datetime-local" value="${finDefaut}"></div>
    </div>
    <label for="f-desc">Précisions (facultatif)</label>
    <textarea id="f-desc" placeholder="Ramener les cartes">${txt(s?.description)}</textarea>
    <label>Statut</label>
    <div class="duo" style="margin-bottom:15px">
      <button type="button" class="btn contour" id="st-ok"
        aria-pressed="${!attDefaut}">Confirmée</button>
      <button type="button" class="btn contour" id="st-att"
        aria-pressed="${attDefaut}">En attente</button>
    </div>
    <div class="duo" style="margin-top:6px">
      <button class="btn contour" id="annuler">Annuler</button>
      <button class="btn plein-terracotta" id="valider">${edition ? "Enregistrer" : "Poser la soirée"}</button>
    </div>`);

  const peintStatut = () => {
    $("#st-ok").setAttribute("aria-pressed", !attDefaut);
    $("#st-att").setAttribute("aria-pressed", attDefaut);
    $("#st-ok").className  = attDefaut ? "btn contour" : "btn";
    $("#st-att").className = attDefaut ? "btn plein-terracotta" : "btn contour";
  };
  peintStatut();
  $("#st-ok").onclick  = () => { attDefaut = false; peintStatut(); };
  $("#st-att").onclick = () => { attDefaut = true;  peintStatut(); };

  $("#f-debut").onchange = () => {
    if (!$("#f-fin").value && $("#f-debut").value) {
      const f = new Date(Date.parse($("#f-debut").value) + 3*3600000);
      $("#f-fin").value = pourInput(f.getTime());
    }
  };
  $("#annuler").onclick = ferme;
  $("#valider").onclick = async () => {
    const titre = $("#f-titre").value.trim();
    const debut = Date.parse($("#f-debut").value);
    const fin   = Date.parse($("#f-fin").value);
    if (!titre)            return erreurForm("Donne un nom à la soirée.");
    if (isNaN(debut))      return erreurForm("Indique la date et l'heure de début.");
    if (isNaN(fin))        return erreurForm("Indique l'heure de fin.");
    if (fin <= debut)      return erreurForm("La fin doit être après le début.");

    const donnees = {
      titre, debut, fin,
      lieu: $("#f-lieu").value.trim(),
      description: $("#f-desc").value.trim(),
      statut: attDefaut ? "attente" : "ok"
    };
    const b = $("#valider"); b.disabled = true; b.textContent = "Enregistrement…";
    try {
      if (edition) { await updateDoc(doc(db,"events",s.id), donnees); ferme(); }
      else {
        const ref = await addDoc(collection(db,"events"), { ...donnees, presences:{} });
        ferme();
        panneauPrevenir("nouvelle", { id: ref.id, ...donnees });
      }
    } catch {
      b.disabled = false; b.textContent = edition ? "Enregistrer" : "Poser la soirée";
      erreurForm("Enregistrement impossible. Vérifie ta connexion.");
    }
  };
}
const erreurForm = m => { $("#err").innerHTML = `<div class="alerte">${m}</div>`; };

/* ---------------- Démarrage ---------------- */
onAuthStateChanged(auth, async u => {
  ferme();
  if (stop)        { stop(); stop = null; }
  if (stopMembres) { stopMembres(); stopMembres = null; }
  if (stopDispos)  { stopDispos(); stopDispos = null; }
  soirees = []; uidParEmail = {}; dispos = {}; moisVu = null;

  if (!u) { moi = null; monEmail = ""; return ecranConnexion(); }

  const email = (u.email || "").toLowerCase();
  if (!MEMBRES[email]) { moi = null; monEmail = ""; return ecranRefus(u.email); }

  moi = u; monEmail = email;
  // L'app enregistre elle-même l'UID : aucun UID à recopier à la main.
  setDoc(doc(db,"membres",u.uid), { email, nom: MEMBRES[email] }, { merge:true }).catch(()=>{});
  ecranApp();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
